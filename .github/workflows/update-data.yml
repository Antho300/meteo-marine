name: Mettre à jour les prévisions marines

on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-marine-forecast
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: python -m pip install -r requirements.txt

      - name: Générer le fichier des prévisions
        run: python scripts/fetch_data.py

      - name: Publier la mise à jour des données
        run: |
          if git diff --quiet -- data/forecast.json && git ls-files --error-unmatch data/forecast.json >/dev/null 2>&1; then
            echo "Aucune donnée modifiée."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/forecast.json
          git commit -m "chore: mise à jour des prévisions marines"
          git push
