name: Mettre à jour les prévisions marines

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-marine-forecast
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: python -m pip install -r requirements.txt

      - name: Générer les prévisions France
        run: python scripts/fetch_data.py --region france

      - name: Générer les prévisions Mer Rouge
        run: python scripts/fetch_data.py --region red-sea

      - name: Exporter les coordonnées demandées et celles des modèles
        run: python scripts/export_coordinate_audit.py

      - name: Publier la mise à jour des données
        run: |
          if git diff --quiet -- data/forecast.json data/forecast.red-sea.json data/coordinates.france.csv data/coordinates.red-sea.csv && git ls-files --error-unmatch data/forecast.json data/forecast.red-sea.json data/coordinates.france.csv data/coordinates.red-sea.csv >/dev/null 2>&1; then
            echo "Aucune donnée modifiée."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/forecast.json data/forecast.red-sea.json data/coordinates.france.csv data/coordinates.red-sea.csv
          git commit -m "chore: mise à jour des prévisions et coordonnées"
          git push
